<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>時計表示（タッチ＆ドラムロール対応）</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
  body {
    font-family: "Inter", sans-serif;
    text-align: center;
    background-color: #ffffff;
    overscroll-behavior-y: none; /* スワイプ時の余計な動きを防ぐ */
  }
  
  #clock-svg-container {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  svg {
    max-width: 320px; /* アナログ時計は少し大きめに確保 */
    height: auto;
    touch-action: none; /* 時計上でのスクロール・ズームを無効化 */
    cursor: pointer;
    border-radius: 50%;
  }

  /* ドラムロールUI。 touch-action: none でスクロールを完全に防ぐ */
  .drum-roll {
    mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%);
    touch-action: none; 
    user-select: none;
    -webkit-user-select: none;
  }

  /* タッチ時のグレーのハイライトを消す */
  .no-tap-highlight {
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== 使い方ポップアップ ===== */
  #howto-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    touch-action: none;
  }
  #howto-overlay.closed {
    display: none;
  }
  #howto-modal {
    background: #ffffff;
    border-radius: 16px;
    padding: 22px 24px;
    max-width: 340px;
    width: 88%;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    text-align: left;
    touch-action: auto;
  }
  #howto-modal h2 {
    font-size: 17px;
    font-weight: bold;
    color: #222;
    margin-bottom: 10px;
  }
  #howto-modal p {
    font-size: 14px;
    line-height: 1.8;
    color: #333;
    margin: 0 0 6px 0;
  }
  #howto-close {
    margin-top: 14px;
    width: 100%;
    min-height: 44px;
    border-radius: 10px;
    background: #f3f4f6;
    border: 1px solid #d1d5db;
    font-size: 15px;
    color: #333;
    touch-action: manipulation;
  }
  #howto-close:active {
    background: #e5e7eb;
  }

  /* ===== デジタル表示・切り替えボタン（左上・枠なし・控えめ） ===== */
  #digital-toggle-btn {
    position: fixed;
    top: 10px;
    left: 10px;
    width: 44px;
    height: 44px;
    min-width: 44px;
    min-height: 44px;
    background: transparent;
    border: none;
    font-size: 26px;
    font-weight: bold;
    line-height: 1;
    color: rgba(120,120,120,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    z-index: 20;
  }
  #digital-toggle-btn:active {
    color: rgba(90,90,90,0.75);
  }
</style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen select-none">

<!-- 使い方ポップアップ（最初に一度だけ表示） -->
<div id="howto-overlay">
  <div id="howto-modal">
    <h2>つかいかた</h2>
    <p>・上のアナログ時計は、針を指でドラッグすると時刻を変更できます。</p>
    <p>・下のデジタル表示は、数字を上下になぞる、またはタップすると時・分を変更できます。</p>
    <p>・画面左上のボタンで、デジタル表示の表示・非表示を切り替えられます。</p>
    <button id="howto-close" class="no-tap-highlight">閉じる</button>
  </div>
</div>

<!-- デジタル表示 切り替えボタン（左上） -->
<button id="digital-toggle-btn" class="no-tap-highlight" aria-label="デジタル表示の切り替え">－</button>

<div id="app" class="p-4 max-w-md w-full flex flex-col items-center">
  
  <!-- アナログ時計（上） -->
  <div id="clock-display" class="mb-4 w-full">
    <div id="clock-svg-container">
      <!-- 時計SVGがここに入る -->
    </div>
  </div>

  <!-- デジタル時計・ドラムロール風UI（下） -->
  <div id="digital-clock" class="flex items-center justify-center space-x-2 mt-2">
    <!-- 時間（Hour）カラム -->
    <div class="drum-roll flex flex-col items-center justify-center h-20 w-12 no-tap-highlight cursor-pointer" id="hour-column">
      <div id="hour-prev" class="text-sm text-gray-300 py-1 transition-colors hover:text-gray-500">5</div>
      <div id="hour-curr" class="text-3xl font-bold text-gray-800 py-1">6</div>
      <div id="hour-next" class="text-sm text-gray-300 py-1 transition-colors hover:text-gray-500">7</div>
    </div>
    
    <!-- コロン -->
    <div class="text-2xl font-bold pb-1" style="color:#000;">:</div>
    
    <!-- 分（Minute）カラム -->
    <div class="drum-roll flex flex-col items-center justify-center h-20 w-12 no-tap-highlight cursor-pointer" id="minute-column">
      <div id="minute-prev" class="text-sm text-gray-300 py-1 transition-colors hover:text-gray-500">29</div>
      <div id="minute-curr" class="text-3xl font-bold text-gray-800 py-1">30</div>
      <div id="minute-next" class="text-sm text-gray-300 py-1 transition-colors hover:text-gray-500">31</div>
    </div>
  </div>

</div>

<script>
  // ダブルタップによる意図しないズームを強制ブロックするハック
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault(); // 300ミリ秒以内の連続タップは無効化
    }
    lastTouchEnd = now;
  }, { passive: false });

  // DOM要素の取得
  const clockSvgContainer = document.getElementById("clock-svg-container");
  
  // 時計の状態を管理する変数
  let currentHour = 6;
  let currentMinute = 30;

  // アナログ時計の描画に必要な定数
  const radius = 120;
  const centerX = 150;
  const centerY = 150;
  const svgNS = "http://www.w3.org/2000/svg";

  let svg, hourHand, minuteHand;
  let isDraggingClock = false;
  let previousMinute = null;

  /**
   * アナログ時計のベースを作成
   */
  function initClock() {
    svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 300 300");
    svg.setAttribute("width", "300");
    svg.setAttribute("height", "300");
    svg.setAttribute("class", "bg-white no-tap-highlight");

    // 時計の外円
    const circle = document.createElementNS(svgNS, "circle");
    circle.setAttribute("cx", centerX);
    circle.setAttribute("cy", centerY);
    circle.setAttribute("r", radius);
    circle.setAttribute("stroke", "black");
    circle.setAttribute("stroke-width", "3");
    circle.setAttribute("fill", "white");
    svg.appendChild(circle);

    // 文字盤の数字 (1-12)
    for(let i = 1; i <= 12; i++) {
      const angle = (i * 30 - 90) * Math.PI / 180;
      const x = centerX + (radius - 30) * Math.cos(angle);
      const y = centerY + (radius - 30) * Math.sin(angle) + 6;
      const text = document.createElementNS(svgNS, "text");
      text.setAttribute("x", x);
      text.setAttribute("y", y);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("font-size", "22");
      text.setAttribute("fill", "#333");
      text.setAttribute("pointer-events", "none");
      text.textContent = i;
      svg.appendChild(text);
    }

    // 分目盛り (60個)
    for(let i = 0; i < 60; i++) {
      const angle = (i * 6 - 90) * Math.PI / 180;
      const innerRadius = (i % 5 === 0) ? radius - 15 : radius - 8;
      const outerX = centerX + radius * Math.cos(angle);
      const outerY = centerY + radius * Math.sin(angle);
      const innerX = centerX + innerRadius * Math.cos(angle);
      const innerY = centerY + innerRadius * Math.sin(angle);

      const line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", innerX);
      line.setAttribute("y1", innerY);
      line.setAttribute("x2", outerX);
      line.setAttribute("y2", outerY);
      line.setAttribute("stroke", "black");
      line.setAttribute("stroke-width", (i % 5 === 0) ? 2 : 1);
      line.setAttribute("pointer-events", "none");
      svg.appendChild(line);
    }

    // 時針
    hourHand = document.createElementNS(svgNS, "line");
    hourHand.setAttribute("x1", centerX);
    hourHand.setAttribute("y1", centerY);
    hourHand.setAttribute("stroke", "#333");
    hourHand.setAttribute("stroke-width", 6);
    hourHand.setAttribute("stroke-linecap", "round");
    hourHand.setAttribute("pointer-events", "none");
    svg.appendChild(hourHand);

    // 分針
    minuteHand = document.createElementNS(svgNS, "line");
    minuteHand.setAttribute("x1", centerX);
    minuteHand.setAttribute("y1", centerY);
    minuteHand.setAttribute("stroke", "#333"); 
    minuteHand.setAttribute("stroke-width", 4);
    minuteHand.setAttribute("stroke-linecap", "round");
    minuteHand.setAttribute("pointer-events", "none");
    svg.appendChild(minuteHand);

    // 中心点
    const centerDot = document.createElementNS(svgNS, "circle");
    centerDot.setAttribute("cx", centerX);
    centerDot.setAttribute("cy", centerY);
    centerDot.setAttribute("r", 6);
    centerDot.setAttribute("fill", "#333");
    centerDot.setAttribute("pointer-events", "none");
    svg.appendChild(centerDot);

    clockSvgContainer.appendChild(svg);

    // タッチ・マウスイベント登録（アナログ時計用）
    svg.addEventListener("pointerdown", handleClockPointerDown);
    svg.addEventListener("pointermove", handleClockPointerMove);
    svg.addEventListener("pointerup", handleClockPointerUp);
    svg.addEventListener("pointercancel", handleClockPointerUp);
  }

  /**
   * 画面全体（デジタル＋アナログ）の表示を更新
   */
  function updateDisplay() {
    // 1. デジタル時計（ドラムロール）の更新
    const hPrev = (currentHour - 1 + 24) % 24;
    const hNext = (currentHour + 1) % 24;
    document.getElementById('hour-prev').textContent = String(hPrev);
    document.getElementById('hour-curr').textContent = String(currentHour);
    document.getElementById('hour-next').textContent = String(hNext);

    const mPrev = (currentMinute - 1 + 60) % 60;
    const mNext = (currentMinute + 1) % 60;
    document.getElementById('minute-prev').textContent = String(mPrev).padStart(2, '0');
    document.getElementById('minute-curr').textContent = String(currentMinute).padStart(2, '0');
    document.getElementById('minute-next').textContent = String(mNext).padStart(2, '0');

    // 2. アナログ時計の針の更新
    if (!hourHand || !minuteHand) return;
    
    const hourAngle = ((currentHour % 12) + currentMinute / 60) * 30 - 90;
    const hourX = centerX + (radius * 0.5) * Math.cos(hourAngle * Math.PI / 180);
    const hourY = centerY + (radius * 0.5) * Math.sin(hourAngle * Math.PI / 180);
    hourHand.setAttribute("x2", hourX);
    hourHand.setAttribute("y2", hourY);

    const minuteAngle = currentMinute * 6 - 90;
    const minuteX = centerX + (radius * 0.75) * Math.cos(minuteAngle * Math.PI / 180);
    const minuteY = centerY + (radius * 0.75) * Math.sin(minuteAngle * Math.PI / 180);
    minuteHand.setAttribute("x2", minuteX);
    minuteHand.setAttribute("y2", minuteY);
  }

  // --- アナログ時計のドラッグ操作ロジック ---
  function handleClockPointerDown(e) {
    isDraggingClock = true;
    svg.setPointerCapture(e.pointerId); // 指が外れても追跡
    calculateTimeFromPointer(e);
  }

  function handleClockPointerMove(e) {
    if (!isDraggingClock) return;
    calculateTimeFromPointer(e);
  }

  function handleClockPointerUp(e) {
    isDraggingClock = false;
    previousMinute = null; 
    svg.releasePointerCapture(e.pointerId);
  }

  function calculateTimeFromPointer(e) {
    e.preventDefault();

    const pt = svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    
    const dx = loc.x - centerX;
    const dy = loc.y - centerY;
    
    let angle = Math.atan2(dy, dx) * 180 / Math.PI;
    angle = (angle + 90) % 360;
    if (angle < 0) angle += 360;
    
    let newMinute = Math.round(angle / 6) % 60;
    
    // 分をまたいだ時の時間変更ロジック
    if (previousMinute !== null) {
        if (previousMinute >= 45 && newMinute <= 15) {
            currentHour = (currentHour + 1) % 24;
        } 
        else if (previousMinute <= 15 && newMinute >= 45) {
            currentHour = (currentHour - 1 + 24) % 24;
        }
    }
    
    previousMinute = newMinute;
    currentMinute = newMinute;
    
    updateDisplay();
  }

  // --- デジタル時計の「指が外れても追跡する」ドラム操作 ---
  function setupDigitalClockEvents() {
    setupDrum('hour-column', true);
    setupDrum('minute-column', false);
    
    // マウスホイール操作（PC用）
    document.getElementById('hour-column').addEventListener('wheel', (e) => handleWheel(e, true), {passive: false});
    document.getElementById('minute-column').addEventListener('wheel', (e) => handleWheel(e, false), {passive: false});
  }

  // なぞる操作（ポインターイベント）のセットアップ
  function setupDrum(columnId, isHour) {
    const el = document.getElementById(columnId);
    let isDraggingDrum = false;
    let startY = 0;
    let accumulatedDelta = 0;
    let hasMoved = false; // クリック判定用

    el.addEventListener('pointerdown', (e) => {
      isDraggingDrum = true;
      hasMoved = false;
      startY = e.clientY;
      accumulatedDelta = 0;
      el.setPointerCapture(e.pointerId); // ★指が枠から出ても追跡する魔法のコード
    });

    el.addEventListener('pointermove', (e) => {
      if (!isDraggingDrum) return;
      
      const currentY = e.clientY;
      const deltaY = currentY - startY;
      
      // わずかなブレは移動とみなさない
      if (Math.abs(deltaY) > 2) {
        hasMoved = true;
      }
      
      startY = currentY;
      accumulatedDelta += deltaY;

      // 12px 動くごとに1つ数字を変える（感度調整）
      if (Math.abs(accumulatedDelta) >= 12) {
        const steps = Math.floor(Math.abs(accumulatedDelta) / 12);
        const direction = accumulatedDelta > 0 ? -1 : 1; // 下になぞると数字が減る
        
        for(let i=0; i<steps; i++){
            if (isHour) {
              currentHour = (currentHour + direction + 24) % 24;
            } else {
              currentMinute = (currentMinute + direction + 60) % 60;
            }
        }
        
        // 余り分を保持して滑らかさを保つ
        accumulatedDelta = accumulatedDelta > 0 ? accumulatedDelta % 12 : -(-accumulatedDelta % 12);
        updateDisplay();
      }
    });

    const endDrag = (e) => {
      if (!isDraggingDrum) return;
      isDraggingDrum = false;
      el.releasePointerCapture(e.pointerId);

      // 動かさずに指を離した場合は「タップ（クリック）」とみなして上下の数字を進める
      if (!hasMoved) {
        // 要素内のクリック位置（上半分か下半分か）を判定
        const rect = el.getBoundingClientRect();
        const clickY = e.clientY - rect.top;
        if (clickY < rect.height / 2) {
          // 上半分をタップ（前の数字へ）
          if (isHour) currentHour = (currentHour - 1 + 24) % 24;
          else currentMinute = (currentMinute - 1 + 60) % 60;
        } else {
          // 下半分をタップ（次の数字へ）
          if (isHour) currentHour = (currentHour + 1) % 24;
          else currentMinute = (currentMinute + 1) % 60;
        }
        updateDisplay();
      }
    };

    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  }

  // マウスホイールで数字を変える
  function handleWheel(e, isHour) {
    e.preventDefault(); // 画面スクロールを防ぐ
    const direction = e.deltaY > 0 ? 1 : -1;
    if (isHour) {
      currentHour = (currentHour + direction + 24) % 24;
    } else {
      currentMinute = (currentMinute + direction + 60) % 60;
    }
    updateDisplay();
  }

  // --- デジタル表示の切り替えボタン ---
  function setupDigitalToggle() {
    const toggleBtn = document.getElementById('digital-toggle-btn');
    const digitalClock = document.getElementById('digital-clock');
    let isVisible = true;

    toggleBtn.addEventListener('click', () => {
      isVisible = !isVisible;
      digitalClock.style.display = isVisible ? 'flex' : 'none';
      toggleBtn.textContent = isVisible ? '－' : '＋';
      toggleBtn.setAttribute('aria-label', isVisible ? 'デジタル表示をかくす' : 'デジタル表示をだす');
    });
  }

  // --- 使い方ポップアップの開閉 ---
  function setupHowtoPopup() {
    const overlay = document.getElementById('howto-overlay');
    const closeBtn = document.getElementById('howto-close');

    const closePopup = () => {
      overlay.classList.add('closed');
    };

    closeBtn.addEventListener('click', closePopup);

    // 背景（モーダルの外側）をタップしても閉じる
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        closePopup();
      }
    });
  }

  // ページ読み込み時の初期化
  window.onload = () => {
      initClock();
      setupDigitalClockEvents();
      setupDigitalToggle();
      setupHowtoPopup();
      updateDisplay();
  };
</script>

</body>
</html>
